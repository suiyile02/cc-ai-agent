# ============================================================
# 本地开发基础设施：Qdrant(向量库) + MySQL(业务库) + Prometheus/Grafana(可观测性)
# 用法: docker compose up -d   (口令从同目录 .env 读取, 见下)
# Qdrant gRPC 端口 6334 / HTTP 6333(控制台 http://localhost:6333/dashboard)
#
# 安全约定(不要放宽):
#   1) 仓库内不放任何口令。先执行: cp .env.example .env 并填入自己的 MYSQL_ROOT_PASSWORD;
#      应用侧对应 export DB_PASSWORD=<同一口令>(或写进 gitignore 的 application-local.yaml)。
#   2) 所有端口只绑 127.0.0.1 —— 避免把 3306/6333 暴露到局域网(Qdrant 未开 API Key 时尤其危险)。
#   3) Redis 不在本文件内, 需自行启动; 生产必须设 requirepass 且不对公网发布。
# ============================================================
services:
  qdrant:
    image: qdrant/qdrant:v1.13.7
    container_name: ai-agent-qdrant
    ports:
      - "127.0.0.1:6333:6333"   # REST / Dashboard
      - "127.0.0.1:6334:6334"   # gRPC(Spring AI 使用)
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: ai-agent-mysql
    environment:
      # 必填、无默认值: 未提供时 compose 直接报错, 防止"示例口令"被带到真实部署
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?未设置 MYSQL_ROOT_PASSWORD, 请先 cp .env.example .env 并填口令}
      MYSQL_DATABASE: ai_agent_db
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  # ============================================================
  # 可观测性(可选容器方案): Prometheus(指标抓取+告警评估) + Grafana(面板/通知)
  # ⚠ 本项目实际部署为"全本机原生运行"(Qdrant/MySQL/Redis 均为原生服务, 实测
  #   mysqld.exe/qdrant.exe/redis-server.exe)——推荐 Prometheus/Grafana 也原生运行
  #   (启动说明见 observability/prometheus.yml 头部), 无需启动以下两个容器服务。
  # 若用容器模式: observability/prometheus.yml 的抓取 target 须改为 host.docker.internal:9090
  #   Prometheus UI:  http://127.0.0.1:9091   (宿主机 9091, 避开应用 9090)
  #   Grafana:        http://127.0.0.1:3000   (默认 admin/admin, 首次登录强制改密)
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ai-agent-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 容器内访问宿主机应用(9090)
    ports:
      - "127.0.0.1:9091:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ai-agent-grafana
    environment:
      # 内网单机: 首次登录 admin/admin 强制改密即可; 需免改密可自行注入 GF_SECURITY_ADMIN_PASSWORD
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  qdrant_storage:
  mysql_data:
  prometheus_data:
  grafana_data:
