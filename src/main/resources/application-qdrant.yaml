# ============================================================
# Qdrant profile: 使用外部 Qdrant 向量库(同时建议搭配 mysql profile)
# 用法: --spring.profiles.active=qdrant  (或 mysql,qdrant)
# 前置: 本机/远端已启动 Qdrant, 例如:
#   docker run -d -p 6333:6333 -p 6334:6334 qdrant/qdrant
# 环境变量: QDRANT_HOST / QDRANT_PORT(gRPC 6334) / QDRANT_API_KEY
# 说明: 覆盖默认 profile 的 autoconfigure.exclude, 放开 Qdrant 自动装配;
#       向量维度与 embedding 模型一致(由 Spring AI 自动探测/建集合)。
# ============================================================
spring:
  autoconfigure:
    exclude: []
  ai:
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        api-key: ${QDRANT_API_KEY:}
        use-tls: false
        collection-name: ${QDRANT_COLLECTION:rag_knowledge_base}
        content-field-name: content
        initialize-schema: true

app:
  rag:
    vector-store: qdrant
