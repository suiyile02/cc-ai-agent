# ============================================================
# MySQL profile: 仅替换数据源(业务表仍由 Hibernate ddl-auto 维护,
# 生产环境可改为 validate 并手动执行 db/mysql/create_table.sql)
# 用法: --spring.profiles.active=mysql
# 环境变量: DB_URL / DB_USERNAME / DB_PASSWORD (缺省见下)
# ============================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_agent_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: update
