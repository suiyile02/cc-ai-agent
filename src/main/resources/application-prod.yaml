# ============================================================
# 生产环境基线(显式激活: --spring.profiles.active=prod)
# 上线前必须通过环境变量注入: JWT_SECRET / DASHSCOPE_API_KEY / DB_* / QDRANT_*
#   (REDIS_PASSWORD 同理——本文件刻意不写它: 留空即无密码连 Redis)
#
# ⚠ 仓库内已不存在 application-dev.yaml: 开发便利开关不再由配置文件提供,
#   本机需要时显式传参(见 README「常用命令」)。dev profile 名仍保留给 SecurityConfigValidator
#   判定"非 prod"用。
# ============================================================
app:
  auth:
    dev-user-header-enabled: false  # 双保险: 禁用 X-User-Id 模拟登录(缺省已关闭)
    # 令牌黑名单 fail-closed: Redis 异常时拒绝请求(需重新登录), 而不是放行已注销的令牌。
    # 注意其代价——Redis 故障期间所有已登录用户会掉线重登; 登录接口本身不受影响(限流仍 fail-open)。
    # 该项由 SecurityConfigValidator 强制: prod 下配成 true 直接拒绝启动。
    blacklist-fail-open: false
  demo:
    seed-enabled: false             # 双保险: 缺省已关闭, 生产绝不自动建账号

logging:
  level:
    com.ai: info
