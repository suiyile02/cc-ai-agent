server:
  port: 9090

spring:
  application:
    name: ai-agent
  threads:
    virtual:
      enabled: true            # Java 21 虚拟线程
  servlet:
    multipart:
      max-file-size: 50MB      # 需求: 单文件最大 50MB(注意: Boot 4 前缀是 spring.servlet.multipart, 非 server.*)
      max-request-size: 500MB
  # ============ 关系库: MySQL(唯一业务库; 表由 spring.sql.init 幂等建表) ============
  # 环境变量: DB_URL / DB_USERNAME / DB_PASSWORD (缺省见下)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/ai_agent_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    # 口令不提供默认值(仓库即凭据来源是泄漏根因): 本地开发需设 DB_PASSWORD 环境变量,
    # 例: export DB_PASSWORD=你的本地口令
    password: ${DB_PASSWORD:}
    # 虚拟线程放大并发请求数, 默认 10 连接会成为瓶颈(对话+审计+摘要并发抢连接)
    hikari:
      maximum-pool-size: 25
      minimum-idle: 10
      connection-timeout: 5000
      max-lifetime: 1800000
  # ============ Redis(登录限流计数/会话元数据缓存; 本地默认无密码) ============
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000
  sql:
    init:
      mode: always
      # 建表脚本已全部 IF NOT EXISTS 幂等; 关闭容错, 避免 SQL 错误被静默吞掉
      continue-on-error: false
      # 核心 5 表(create_table.sql) + 扩展表(员工/订单/用户/决策日志/上下文管线)
      schema-locations: classpath:db/create_table.sql,classpath:db/schema-mysql-extra.sql

  ai:
    openai:
      # 默认对接阿里云百炼(DashScope) OpenAI 兼容模式; 也兼容本地 Ollama / 任意 OpenAI 兼容网关
      api-key: ${DASHSCOPE_API_KEY:}
      # 端点必须通过环境变量注入(默认为阿里云百炼官方兼容端点); 个人专属 MaaS 端点请勿写入仓库
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      # 客户端总超时(okhttp): 默认 60s, 流式下长思考(思维链)会整段静默撞上它被 CANCEL。
      # 应用层 stream-idle-timeout-ms(20s)会先触发止损, 此值仅作二次保险(同步调用/保护被关闭时)
      timeout: 120s
      chat:
        model: ${AI_CHAT_MODEL:qwen3.8-max}
        temperature: 0.3
      embedding:
        model: ${AI_EMBEDDING_MODEL:qwen3.7-text-embedding}
        dimensions: 1024    # 向量维度
    # 内置重试(对所有模型调用生效: chat/改写/摘要): 只补单次瞬态失败(429/5xx/网络抖动),
    # 与业务层超时(Timeouts)和改写熔断互补; 慢端点重试会放大延迟, 故只重试一次
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 2000
        multiplier: 2
        max-interval: 8000
    # ============ 向量库: Qdrant(唯一向量库; 首次启动自动建集合, 维度随 embedding 模型) ============
    # 前置: 已启动 Qdrant(docker compose up -d); 环境变量: QDRANT_HOST / QDRANT_PORT(gRPC 6334) / QDRANT_API_KEY
    vectorstore:
      qdrant:
        # 用 127.0.0.1 而非 localhost: 后者在双栈机器上可能先解析到 ::1, 而 Qdrant/MySQL 常只监听 IPv4
        host: ${QDRANT_HOST:127.0.0.1}
        port: ${QDRANT_PORT:6334}  # gRPC 端口(Spring AI 走 gRPC, HTTP REST 才是 6333)
        # 空串时本地无鉴权 Qdrant 会忽略该请求头; 接 Qdrant Cloud/带鉴权实例时设置 QDRANT_API_KEY 即可
        api-key: ${QDRANT_API_KEY:}
        use-tls: false
        # 引用 app.rag.collection-name(单一事实来源)——写集合与删/重建集合永远一致, 杜绝配置漂移
        collection-name: ${app.rag.collection-name}
        content-field-name: content
        initialize-schema: true

# ================= 业务自定义配置 =================
app:
  rag:
    collection-name: rag_knowledge_base   # 【单一事实来源】Qdrant 集合名(spring.ai 配置引用此值), 改这里即可
    top-k: 5                              # 检索 Top-K(需求默认 5)
    similarity-threshold: 0.45            # 相似度阈值(实测该 embedding 模型分数偏低, 0.6 会误杀正确 chunk, 如"加班调休"0.565)
    context-max-chars: 8000               # 注入上下文的最大字符数
    auto-route: true                      # 意图路由: 常识/闲聊自动跳过 RAG 检索直接作答; false=每次都检索
    auto-rebuild-index: true              # 启动时自动重建关键词索引(从 Qdrant 读回分块, 不重新向量化)
    # internal-keywords: [...]            # 意图路由关键词表(缺省内置企业词表, 见 AppProperties, 可在此覆盖)
    # tool-keywords: [...]                # 工具类问题词表(订单/物流/快递等, 缺省见 AppProperties): 命中即跳过检索交给工具调用
    hybrid-enabled: true                  # 混合检索: 语义向量 + 关键词(BM25) 多路召回; false=仅语义检索
    rerank-mode: score                    # 重排: score=分数融合 | llm=大模型重排(失败回退score) | none=仅RRF排序
    retrieve-timeout-ms: 10000            # 检索整段预算(嵌入+向量库+关键词+重排); 超时按"已执行零命中"降级, 避免慢端点把对话拖到上百秒
  storage:
    path: ./data/files                    # 上传文件本地存储根目录
  chat:
    model-label: qwen3.8-max   # 兜底标签: 优先从 ChatModel 默认选项解析实际模型名(见 ChatClientProvider.modelLabel), 对话日志与语义缓存键共用
    disable-thinking: true       # 关闭主对话思维链: 修复 qwen3 长思考整段静默 >60s 撞 okhttp 超时被重置; 同时大幅提速
    stream-include-usage: true   # 流式请求索取 usage(否则 chat_log.total_tokens 恒为空); 网关不认该字段时置 false
    stream-idle-timeout-ms: 20000  # 流式静默超时: 模型 20s 无增量即主动终止降级(早于 okhttp 60s read timeout)
  auth:
    # JWT 密钥: 仓库内不放任何默认值。留空时——非生产由 JwtTokenProvider 生成一次性随机密钥
    # (每次重启后旧 token 失效, 便于本地开发); 生产(profile=prod)留空直接拒绝启动。
    jwt-secret: ${JWT_SECRET:}
    token-expire-hours: 168                   # 7 天
    # 开发便捷开关(默认关闭!): 允许用 X-User-Id 请求头模拟登录, 存在身份伪造风险,
    # 仅在本地开发时激活 dev profile(--spring.profiles.active=dev)开启
    dev-user-header-enabled: false
    # 登录失败限流存储后端: redis=多实例统一计数(默认, Redis 不可用时按未锁定放行) | memory=单实例进程内计数
    rate-limit-backend: redis
    # 令牌黑名单在 Redis 异常时的口径: true=放行(保可用) | false=拒绝(保安全, 生产必须 false,
    # 由 SecurityConfigValidator 在 prod 启动期强制)
    blacklist-fail-open: true
  # ============ 演示数据播种(仅空表生效) ============
  demo:
    seed-enabled: true                        # 生产 profile 已关闭(不创建任何账号)
    # 仅播种时使用的演示口令; 生产请保持 seed-enabled=false, 或经 DEMO_ADMIN_PASSWORD 注入
    admin-password: ${DEMO_ADMIN_PASSWORD:admin123}
  # ============ 语义缓存(P3-3): 相同 KB 问题的回答缓存, 命中跳过检索+模型调用 ============
  semantic-cache:
    enabled: true
    ttl-hours: 24            # 正缓存有效期 24h; 知识库文档变更会立即全部失效
    miss-ttl-minutes: 30     # 负缓存(穿透防护): 检索零命中的问题 30 分钟内直接返回"未找到", 不再打检索+模型
  intent-cache:
    enabled: true
    ttl-minutes: 60          # 意图路由结果缓存(问题→TOOL/KB/GENERAL); 改路由词表后可 DELETE /api/system/intent-cache 立即失效
  # ============ 并发防护(B3): 单用户并发对话上限 ============
  concurrency:
    max-concurrent-per-user: 3    # 超并发返回 429/6010
    acquire-timeout-ms: 1000
  # ============ 会话自动标题: 首轮把"未命名会话"填成有意义的短标题 ============
  session-title:
    enabled: true
    fallback-chars: 24       # 兜底标题=问题前 24 字(同步写库, 零等待, 模型不可用也有标题)
    model-enabled: true      # 关闭则一直停留在截断版, 完全不产生模型开销
    max-chars: 30            # 精修标题上限(模型不守规矩时的硬截断保护)
    timeout-ms: 8000         # 精修调用超时; 与本轮回答并行, 超时仅保留兜底标题
  # ============ 文档解析防护(A2): 解析超时 + 解压炸弹预检 ============
  ingestion:
    parse-timeout-ms: 120000       # 单文档解析超时(超时置 status=3)
    max-uncompressed-bytes: 536870912   # docx 解压后总大小上限(512MB)
    max-zip-entries: 5000          # docx 内部条目数上限
  # ============ 日志保留期定时清理(P2-4) ============
  log-retention:
    enabled: true
    retention-days: 180
    cron: "0 0 3 * * ?"                       # 每天凌晨 3 点
  # ============ 跨域(对接前端 Vue3) ============
  cors:
    allowed-origins:                          # 为空列表则不启用 CORS
      - http://localhost:5173
  # ============ 上下文处理管线(统一 Token 预算 / 多轮改写 / 历史摘要) ============
  context:
    model-max-tokens: 8192       # 模型上下文窗口上限(token)
    reserved-for-answer: 1500    # 为回答预留的 token(可用预算 = max - reserved)
    budget:                      # 各段预算占比(总预算按占比切分)
      system: 0.15               # system 提示词(不含 RAG)
      history: 0.35              # 历史(摘要 + 最近窗口)
      rag: 0.40                  # RAG 检索上下文
      user: 0.10                 # 当前用户输入
    query-rewrite:
      enabled: true              # 多轮查询改写/指代消解(追问改写为独立检索问题)
      min-history-turns: 1       # 触发改写所需最小历史轮数(首轮跳过)
      timeout-ms: 30000          # 改写调用超时(实测端点 10.7~28.9s, 连续失败≥2次熔断60s)
      reference-hint-required: true  # 指代词启发式: 问题不含指代/省略线索词时跳过改写(零等待)
      # reference-hints: [...]   # 线索词表(缺省: 那/它/他/她/这个/上面/刚才等, 见 AppProperties)
      disable-thinking: true     # 改写调用注入 enable_thinking=false(qwen3 关思维链, 实测大幅降延迟)
    summary:
      enabled: true              # 历史滚动摘要压缩
      trigger-messages: 20       # 历史消息数超过该阈值触发摘要
      keep-recent-messages: 8    # 压缩后保留的最近消息条数(不并入摘要)
      max-tokens: 400            # 摘要文本 token 上限
      timeout-ms: 30000          # 摘要模型调用超时(后台异步执行, 不阻塞对话)
      trigger-tokens: 0          # 历史 Token 阈值(第二触发条件); 0=关闭, 仅按条数触发
      disable-thinking: true     # 摘要调用注入 enable_thinking=false(后台任务提速)
    history:
      max-messages: 30           # 历史窗口硬上限(条), 与 token 预算取更严者

logging:
  level:
    com.ai: info
    org.springframework.ai: warn
    # 调试对话/改写/摘要时打开: SimpleLoggerAdvisor 会打印发给模型的完整 prompt 与响应
    # org.springframework.ai.chat.client.advisor: debug

# 说明: MyBatis-Plus 为 Boot4 手工装配(见 MybatisPlusConfig), 不读取 mybatis-plus.* yaml 配置;
# 关键项(驼峰映射/banner/审计填充/分页插件)均在该配置类中显式声明。

# ================= 运维端点 =================
management:
  endpoints:
    web:
      exposure:
        include: health,info     # 仅暴露健康检查与基本信息
  endpoint:
    health:
      probes:
        enabled: true            # 容器/K8s 存活与就绪探针
