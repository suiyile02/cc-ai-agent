server:
  port: 9090

spring:
  application:
    name: ai-agent
  # 本地免环境变量入口(IDEA 直接点启动也能连库): 模块根目录放 application-local.yaml
  # 写 DB_PASSWORD 等键即可, 该文件已在 .gitignore 内。optional: 前缀保证文件不存在时
  # (生产容器/CI/新克隆)照常启动, 不报错。
  config:
    import: optional:file:./application-local.yaml
  threads:
    virtual:
      enabled: true            # Java 21 虚拟线程
  servlet:
    multipart:
      max-file-size: 50MB      # 需求: 单文件最大 50MB(注意: Boot 4 前缀是 spring.servlet.multipart, 非 server.*)
      max-request-size: 500MB
  # ============ 关系库: MySQL(唯一业务库; 表由 spring.sql.init 幂等建表) ============
  # 环境变量: DB_URL / DB_USERNAME / DB_PASSWORD (缺省见下)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/ai_agent_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    # 虚拟线程放大并发请求数, 默认 10 连接会成为瓶颈(对话+审计+摘要并发抢连接)
    hikari:
      maximum-pool-size: 25
      minimum-idle: 10
      connection-timeout: 5000
      max-lifetime: 1800000
  # ============ Redis(登录限流计数/会话元数据缓存; 本地默认无密码) ============
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000
  sql:
    init:
      mode: always
      # 建表脚本已全部 IF NOT EXISTS 幂等; 关闭容错, 避免 SQL 错误被静默吞掉
      continue-on-error: false
      # 核心 5 表(create_table.sql) + 扩展表(员工/订单/用户/决策日志/上下文管线)
      schema-locations: classpath:db/create_table.sql,classpath:db/schema-mysql-extra.sql

  ai:
    openai:
      # 默认对接阿里云百炼(DashScope) OpenAI 兼容模式; 也兼容本地 Ollama / 任意 OpenAI 兼容网关
      api-key: ${DASHSCOPE_API_KEY:}
      # 端点必须通过环境变量注入(默认为阿里云百炼官方兼容端点); 个人专属 MaaS 端点请勿写入仓库
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      # 客户端总超时(okhttp): 默认 60s, 流式下长思考(思维链)会整段静默撞上它被 CANCEL。
      # 应用层 stream-idle-timeout-ms(20s)会先触发止损, 此值仅作二次保险(同步调用/保护被关闭时)
      timeout: 120s
      chat:
        model: ${AI_CHAT_MODEL:qwen3.8-max}
        temperature: 0.3
      embedding:
        model: ${AI_EMBEDDING_MODEL:qwen3.7-text-embedding}
        dimensions: 1024    # 向量维度
    # 内置重试(对所有模型调用生效: chat/改写/摘要): 只补单次瞬态失败(429/5xx/网络抖动),
    # 与业务层超时(Timeouts)和改写熔断互补; 慢端点重试会放大延迟, 故只重试一次
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 2000
        multiplier: 2
        max-interval: 8000
    # ============ 向量库: Qdrant(唯一向量库; 首次启动自动建集合, 维度随 embedding 模型) ============
    # 前置: 已启动 Qdrant(docker compose up -d); 环境变量: QDRANT_HOST / QDRANT_PORT(gRPC 6334) / QDRANT_API_KEY
    vectorstore:
      qdrant:
        # 用 127.0.0.1 而非 localhost: 后者在双栈机器上可能先解析到 ::1, 而 Qdrant/MySQL 常只监听 IPv4
        host: ${QDRANT_HOST:127.0.0.1}
        port: ${QDRANT_PORT:6334}  # gRPC 端口(Spring AI 走 gRPC, HTTP REST 才是 6333)
        # 空串时本地无鉴权 Qdrant 会忽略该请求头; 接 Qdrant Cloud/带鉴权实例时设置 QDRANT_API_KEY 即可
        api-key: ${QDRANT_API_KEY:}
        use-tls: false
        # 引用 app.rag.collection-name(单一事实来源)——写集合与删/重建集合永远一致, 杜绝配置漂移
        collection-name: ${app.rag.collection-name}
        content-field-name: content
        initialize-schema: true

# ================= 业务自定义配置(app.*) =================
# 【默认值策略: Java 单一事实来源】各段配置的实体与默认值在 com.ai.config.props 下按前缀一一对应
# (RagProps ↔ app.rag.*, ContextProps ↔ app.context.* …)。本文件只保留两类键:
#   ① 环境相关、需经环境变量注入的值(端点/口令/集合名/模型标签/CORS 来源);
#   ② 安全基线与成本闸门(kb-only / dev-user-header / seed / 各类超时与上限)。
# 其余业务调参(top-k、阈值、预算占比、词表…)只在 props 类里写一次, 新增配置项时不要顺手抄到这里。
#
# 【严格绑定】AppProperties 开了 ignoreUnknownFields=false: 这里出现绑不上字段的 app.* 键会直接
# 启动失败。所以"改了没生效""键名拼错""该项已随重构删除"三类问题不可能静默存在——这是本项目
# 为配置漂移付过学费后定的硬约束, 不要为了省事把它关掉。
app:
  rag:
    # 【单一事实来源】Qdrant 集合名(spring.ai.vectorstore.qdrant.collection-name 引用此值),
    # 写集合与删/重建集合永远一致; 换环境隔离库时改这里。
    collection-name: rag_knowledge_base
  storage:
    path: ./data/files                    # 上传根目录; 多实例部署必须换共享存储(见 roadmap E 系列)
  chat:
    model-label: ${AI_CHAT_MODEL:qwen3.8-max}  # 兜底标签: 优先从 ChatModel 默认选项解析实际模型名
                                              # (见 ChatClientProvider.modelLabel), 对话日志与语义缓存键共用
    kb-only: true                         # 严格知识库模式: 只依据知识库资料/工具结果作答, 无命中按固定口径拒答
                                          # (提示词级软约束, 不保证零编造; AGENT 会话不受影响) 见 prompts/kb-only-system.st
    stream-idle-timeout-ms: 20000         # 流式静默止损: 20s 无增量即终止降级(早于 okhttp 60s read timeout)
    max-tool-calls-per-turn: 8            # 单轮工具调用上限(B2): 超限抛 6009 回传模型收尾, 防无限连环调工具烧 Token
  auth:
    # JWT 密钥: 仓库内不放任何默认值。留空时——非生产由 JwtTokenProvider 生成一次性随机密钥
    # (每次重启后旧 token 失效, 便于本地开发); 生产(profile=prod)留空直接拒绝启动。
    jwt-secret: ${JWT_SECRET:}
    # 开发便捷开关(默认关闭, 仓库内不提供任何打开它的配置文件): 允许用 X-User-Id 请求头模拟登录,
    # 存在身份伪造风险。本机调试需要时显式传参: --app.auth.dev-user-header-enabled=true
    dev-user-header-enabled: false
    # 登录失败限流存储后端: redis=多实例统一计数(默认, Redis 不可用时按未锁定放行) | memory=单实例进程内计数
    rate-limit-backend: redis
    # 令牌黑名单在 Redis 异常时的口径: true=放行(保可用) | false=拒绝(保安全, 生产必须 false,
    # 由 SecurityConfigValidator 在 prod 启动期强制)
    blacklist-fail-open: true
  # ============ 演示数据播种(默认关闭: 仓库不再自带任何可用口令/账号) ============
  # 首个管理员: 用开放的 POST /api/auth/register 注册, 再把 sys_user.role 改成 ADMIN;
  # 员工/订单等工具演示数据需要时执行 docs/seed/seed-mysql.sql。
  demo:
    seed-enabled: false                   # true 会按下面的口令自动建出 admin 账号, 仅刻意演示时开
    # 仅播种时使用的口令; 留空则拒绝播种而不是退回某个写死的口令
    admin-password: ${DEMO_ADMIN_PASSWORD:}
  # ============ 跨域(对接前端 Vue3): 上线前必须换成真实前端域名, 为空列表则不启用 CORS ============
  cors:
    allowed-origins:
      - http://localhost:5173
  # ============ 以下三段是"成本闸门": 决定每轮对话打几次模型/花多少 Token, 故留在本清单可审 ============
  context:
    query-rewrite:
      timeout-ms: 30000                   # 改写调用超时(实测端点 10.7~28.9s, 预算小于真实耗时会永远超时)
    short-query:
      timeout-ms: 3000                    # 短查询扩展超时; 超时/失败/空结果一律回退原问题
    summary:
      timeout-ms: 30000                   # 历史摘要模型调用超时(后台异步执行, 不阻塞对话)
  session-title:
    timeout-ms: 8000                      # 标题精修调用超时; 超时放弃, 保留截断兜底标题
  ingestion:
    parse-timeout-ms: 120000              # 单文档解析超时(超时置 status=3)
    max-uncompressed-bytes: 536870912     # docx 解压后总大小上限(512MB, 超限疑似压缩炸弹)
    max-zip-entries: 5000                 # docx 内部条目数上限
  concurrency:
    max-concurrent-per-user: 3            # 超并发返回 429/6010
    acquire-timeout-ms: 1000

logging:
  level:
    com.ai: info
    org.springframework.ai: warn
    # 调试对话/改写/摘要时打开: SimpleLoggerAdvisor 会打印发给模型的完整 prompt 与响应
    # org.springframework.ai.chat.client.advisor: debug

# 说明: MyBatis-Plus 为 Boot4 手工装配(见 MybatisPlusConfig), 不读取 mybatis-plus.* yaml 配置;
# 关键项(驼峰映射/banner/审计填充/分页插件)均在该配置类中显式声明。

# ================= 运维端点 =================
management:
  endpoints:
    web:
      exposure:
        include: health,info     # 仅暴露健康检查与基本信息
  endpoint:
    health:
      probes:
        enabled: true            # 容器/K8s 存活与就绪探针

